name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: power_agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure AGP legacy flags
        run: |
          grep -q "android.useAndroidX=true" android/gradle.properties || echo "android.useAndroidX=true" >> android/gradle.properties
          grep -q "android.newDsl=false" android/gradle.properties || echo "android.newDsl=false" >> android/gradle.properties
          cat android/gradle.properties

      - name: Pub get
        working-directory: power_agent
        run: flutter pub get

      - name: Build debug APK
        working-directory: power_agent
        run: flutter build apk --debug -- --no-daemon -Pandroid.newDsl=false

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: power_agent/build/app/outputs/flutter-apk/app-debug.apk

      - name: Publish GitHub Release (direct APK)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-${{ github.run_number }}-${{ github.run_attempt }}"
          APK_SRC="build/app/outputs/flutter-apk/app-debug.apk"
          APK_OUT="PowerAgent-debug-build-${{ github.run_number }}.apk"
          cp "$APK_SRC" "$APK_OUT"
          gh release create "$TAG" "$APK_OUT" --title "$TAG" --notes "Debug APK build ${{ github.run_number }}" --latest
